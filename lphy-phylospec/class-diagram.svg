<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1220" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E9EEEA" stroke-width="1"/>
    </pattern>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2420" flood-opacity="0.16"/>
    </filter>

    <marker id="triHollow" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#FFFFFF" stroke="#4B5850" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>

    <marker id="diamondFilled" viewBox="0 0 16 10" refX="16" refY="5" markerWidth="16" markerHeight="10" orient="auto">
      <path d="M0,5 L8,0 L16,5 L8,10 Z" fill="#4B5850"/>
    </marker>

    <marker id="diamondHollow" viewBox="0 0 16 10" refX="16" refY="5" markerWidth="16" markerHeight="10" orient="auto">
      <path d="M0,5 L8,0 L16,5 L8,10 Z" fill="#FFFFFF" stroke="#4B5850" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>

    <marker id="arrowOpen" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#4B5850" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1220" height="1220" fill="#FCFDFB"/>
  <rect x="0" y="0" width="1220" height="1220" fill="url(#gridPattern)"/>

  <!-- package regions -->
  <rect x="40" y="170" width="1120" height="478" rx="18" fill="#EEF1EF" opacity="0.55" stroke="#B9C3BC" stroke-width="1.5" stroke-dasharray="7,5"/>
  <rect x="250" y="678" width="830" height="442" rx="18" fill="#E4F2ED" opacity="0.55" stroke="#8FC3AE" stroke-width="1.5" stroke-dasharray="7,5"/>

  <rect x="56" y="156" width="330" height="26" rx="6" fill="#7C8A83"/>
  <text x="221" y="173.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.04em" fill="#FFFFFF">PHYLOSPEC-CORE &#8212; REUSED AS-IS</text>

  <rect x="266" y="664" width="266" height="26" rx="6" fill="#2F6F5E"/>
  <text x="399" y="681.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.04em" fill="#FFFFFF">LPHY-PHYLOSPEC &#8212; NEW</text>

  <!-- title -->
  <text x="60" y="52" font-size="27" font-weight="700" fill="#1B2420">PhyloSpec &#8594; LPhy Tiling &#8212; Class Diagram</text>
  <text x="60" y="78" font-size="14" fill="#56655D">lphy-phylospec design snapshot: one AST-node tile, auto-generated per LPhy generator, plus a short hand-written override list.</text>

  <!-- connectors (drawn under the boxes) -->
  <g fill="none" stroke="#4B5850" stroke-width="1.6">
    <!-- A: GeneratorTile extends Tile -->
    <path d="M460,362 L460,302" marker-end="url(#triHollow)"/>
    <!-- B: GeneratorTile implements CandidateTile -->
    <path d="M580,362 L740,266" stroke-dasharray="6,5" marker-end="url(#triHollow)"/>
    <!-- C: GeneratorTileInput extends TileInput -->
    <path d="M180,544 L180,474" marker-end="url(#triHollow)"/>
    <!-- D: GeneratorTile declares GeneratorTileInput -->
    <path d="M300,586 L340,409" marker-end="url(#diamondFilled)"/>
    <!-- E: ReflectiveGeneratorTile extends GeneratorTile -->
    <path d="M390,698 L460,456" marker-end="url(#triHollow)"/>
    <!-- F: ExponentialTile extends GeneratorTile -->
    <path d="M670,698 L580,456" marker-end="url(#triHollow)"/>
    <!-- G: LPhyCoreTileLibrary extends TileLibrary -->
    <path d="M900,698 L860,456" marker-end="url(#triHollow)"/>
    <!-- H: LPhyCoreTileLibrary aggregates ReflectiveGeneratorTile (routed under ExponentialTile) -->
    <path d="M510,749 L510,820 L860,820 L860,764" marker-end="url(#diamondHollow)"/>
    <!-- I: LPhyCoreTileLibrary aggregates ExponentialTile -->
    <path d="M790,745 L940,764" marker-end="url(#diamondHollow)"/>
    <!-- J: ReflectiveGeneratorTile depends on LPhyState -->
    <path d="M390,800 L410,870" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <!-- K: ExponentialTile depends on LPhyState -->
    <path d="M670,792 L650,870" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <!-- L: PhyloSpecToLPhyRunner uses EvaluateTiles (routed via right margin) -->
    <path d="M980,1067 L1180,1067 L1180,404 L1140,404" marker-end="url(#arrowOpen)"/>
    <!-- M: PhyloSpecToLPhyRunner uses LPhyState -->
    <path d="M780,1034 L650,954" marker-end="url(#arrowOpen)"/>
    <!-- N: EvaluateTiles uses TileLibrary -->
    <path d="M900,404 L860,409" marker-end="url(#arrowOpen)"/>
  </g>

  <!-- edge labels -->
  <g font-size="11" font-style="italic" fill="#56655D">
    <rect x="248" y="470" width="72" height="16" fill="#FCFDFB" opacity="0.85"/>
    <text x="252" y="482">declares</text>

    <rect x="700" y="990" width="60" height="16" fill="#FCFDFB" opacity="0.85"/>
    <text x="704" y="1002">creates</text>
  </g>

  <!-- boxes -->

  <!-- Tile<T,S> -->
  <g filter="url(#cardShadow)">
    <rect x="340" y="190" width="240" height="112" rx="10" fill="#EEF1EF" stroke="#7C8A83" stroke-width="1.6"/>
  </g>
  <line x1="340" y1="230" x2="580" y2="230" stroke="#7C8A83" stroke-width="1"/>
  <text x="460" y="208" text-anchor="middle" font-size="11" font-style="italic" fill="#5C6A63">&#171;abstract&#187;</text>
  <text x="460" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#243029">Tile&#8202;&lt;T,S&gt;</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#33403A">
    <text x="354" y="248">+ apply(state, idx) T</text>
    <text x="354" y="266"># applyTile(state, idx) T</text>
    <text x="354" y="284"># getTileInputs() List</text>
  </g>

  <!-- CandidateTile<S> -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="190" width="240" height="76" rx="10" fill="#EEF1EF" stroke="#7C8A83" stroke-width="1.6"/>
  </g>
  <line x1="620" y1="230" x2="860" y2="230" stroke="#7C8A83" stroke-width="1"/>
  <text x="740" y="208" text-anchor="middle" font-size="11" font-style="italic" fill="#5C6A63">&#171;interface&#187;</text>
  <text x="740" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#243029">CandidateTile&#8202;&lt;S&gt;</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#33403A">
    <text x="634" y="248">+ tryToTile(node) Set</text>
  </g>

  <!-- TileInput<T,S> -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="362" width="240" height="112" rx="10" fill="#EEF1EF" stroke="#7C8A83" stroke-width="1.6"/>
  </g>
  <line x1="60" y1="402" x2="300" y2="402" stroke="#7C8A83" stroke-width="1"/>
  <text x="180" y="380" text-anchor="middle" font-size="11" font-style="italic" fill="#5C6A63">&#171;abstract&#187;</text>
  <text x="180" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#243029">TileInput&#8202;&lt;T,S&gt;</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#33403A">
    <text x="74" y="420">- required boolean</text>
    <text x="74" y="438">+ apply(state, idx) T</text>
    <text x="74" y="456">+ getTypeToken() TypeToken</text>
  </g>

  <!-- GeneratorTile<T,S> -->
  <g filter="url(#cardShadow)">
    <rect x="340" y="362" width="240" height="94" rx="10" fill="#EEF1EF" stroke="#7C8A83" stroke-width="1.6"/>
  </g>
  <line x1="340" y1="402" x2="580" y2="402" stroke="#7C8A83" stroke-width="1"/>
  <text x="460" y="380" text-anchor="middle" font-size="11" font-style="italic" fill="#5C6A63">&#171;abstract&#187;</text>
  <text x="460" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#243029">GeneratorTile&#8202;&lt;T,S&gt;</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#33403A">
    <text x="354" y="420">+ getPhyloSpecGeneratorName()</text>
    <text x="354" y="438">+ getGeneratorTileInputs() List</text>
  </g>

  <!-- TileLibrary<S> -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="362" width="240" height="94" rx="10" fill="#EEF1EF" stroke="#7C8A83" stroke-width="1.6"/>
  </g>
  <line x1="620" y1="402" x2="860" y2="402" stroke="#7C8A83" stroke-width="1"/>
  <text x="740" y="380" text-anchor="middle" font-size="11" font-style="italic" fill="#5C6A63">&#171;abstract&#187;</text>
  <text x="740" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#243029">TileLibrary&#8202;&lt;S&gt;</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#33403A">
    <text x="634" y="420">+ getTiles() List</text>
    <text x="634" y="438">+ loadAll(stateType)$ List</text>
  </g>

  <!-- EvaluateTiles<S> -->
  <g filter="url(#cardShadow)">
    <rect x="900" y="362" width="240" height="84" rx="10" fill="#EEF1EF" stroke="#7C8A83" stroke-width="1.6"/>
  </g>
  <line x1="900" y1="392" x2="1140" y2="392" stroke="#7C8A83" stroke-width="1"/>
  <text x="1020" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#243029">EvaluateTiles&#8202;&lt;S&gt;</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#33403A">
    <text x="914" y="408">+ getBestTiling(stmts)</text>
    <text x="914" y="426">+ applyBestTiling(state) S</text>
  </g>

  <!-- GeneratorTileInput<T,S> -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="544" width="240" height="84" rx="10" fill="#EEF1EF" stroke="#7C8A83" stroke-width="1.6"/>
  </g>
  <line x1="60" y1="574" x2="300" y2="574" stroke="#7C8A83" stroke-width="1"/>
  <text x="180" y="564" text-anchor="middle" font-size="15" font-weight="700" fill="#243029">GeneratorTileInput&#8202;&lt;T,S&gt;</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#33403A">
    <text x="74" y="590">- phylospecArgumentName</text>
    <text x="74" y="608">+ getKey() String</text>
  </g>

  <!-- ReflectiveGeneratorTile<T> -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="698" width="240" height="102" rx="10" fill="#E4F2ED" stroke="#2F6F5E" stroke-width="1.6"/>
  </g>
  <line x1="270" y1="728" x2="510" y2="728" stroke="#2F6F5E" stroke-width="1"/>
  <text x="390" y="718" text-anchor="middle" font-size="14.5" font-weight="700" fill="#173229">ReflectiveGeneratorTile&#8202;&lt;T&gt;</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#204636">
    <text x="284" y="744">- lphyGenerator Generator</text>
    <text x="284" y="762"># getTileInputs() List</text>
    <text x="284" y="780"># applyTile(state, idx) T</text>
  </g>

  <!-- ExponentialTile -->
  <g filter="url(#cardShadow)">
    <rect x="550" y="698" width="240" height="94" rx="10" fill="#FBF1E1" stroke="#A6742E" stroke-width="1.6"/>
  </g>
  <line x1="550" y1="738" x2="790" y2="738" stroke="#A6742E" stroke-width="1"/>
  <text x="670" y="718" text-anchor="middle" font-size="11" font-style="italic" fill="#8A6127">&#171;hand-written override&#187;</text>
  <text x="670" y="734" text-anchor="middle" font-size="15" font-weight="700" fill="#4A3417">ExponentialTile</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#5B4118">
    <text x="564" y="758"># applyTile(state, idx) T</text>
    <text x="564" y="776">rate &#8594; mean = 1/rate</text>
  </g>

  <!-- LPhyCoreTileLibrary -->
  <g filter="url(#cardShadow)">
    <rect x="820" y="698" width="240" height="66" rx="10" fill="#E4F2ED" stroke="#2F6F5E" stroke-width="1.6"/>
  </g>
  <line x1="820" y1="728" x2="1060" y2="728" stroke="#2F6F5E" stroke-width="1"/>
  <text x="940" y="718" text-anchor="middle" font-size="15" font-weight="700" fill="#173229">LPhyCoreTileLibrary</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#204636">
    <text x="834" y="744">+ getTiles() List</text>
  </g>

  <!-- LPhyState -->
  <g filter="url(#cardShadow)">
    <rect x="410" y="870" width="240" height="84" rx="10" fill="#E4F2ED" stroke="#2F6F5E" stroke-width="1.6"/>
  </g>
  <line x1="410" y1="900" x2="650" y2="900" stroke="#2F6F5E" stroke-width="1"/>
  <text x="530" y="890" text-anchor="middle" font-size="15" font-weight="700" fill="#173229">LPhyState</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#204636">
    <text x="424" y="916">+ GraphicalModel model</text>
    <text x="424" y="934">+ register(name, value)</text>
  </g>

  <!-- PhyloSpecToLPhyRunner -->
  <g filter="url(#cardShadow)">
    <rect x="740" y="1034" width="240" height="66" rx="10" fill="#E4F2ED" stroke="#2F6F5E" stroke-width="1.6"/>
  </g>
  <line x1="740" y1="1064" x2="980" y2="1064" stroke="#2F6F5E" stroke-width="1"/>
  <text x="860" y="1054" text-anchor="middle" font-size="14.5" font-weight="700" fill="#173229">PhyloSpecToLPhyRunner</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#204636">
    <text x="754" y="1080">+ runPhyloSpec(runName)</text>
  </g>

  <!-- notation legend footer -->
  <line x1="40" y1="1128" x2="1180" y2="1128" stroke="#D6DDD7" stroke-width="1"/>
  <text x="40" y="1150" font-size="11" font-weight="700" letter-spacing="0.05em" fill="#56655D">HOW TO READ THE ARROWS</text>

  <g font-size="12" fill="#33403A">
    <path d="M40,1178 L92,1178" stroke="#4B5850" stroke-width="1.6" fill="none" marker-end="url(#triHollow)"/>
    <text x="102" y="1182">inheritance (extends)</text>

    <path d="M290,1178 L342,1178" stroke="#4B5850" stroke-width="1.6" fill="none" stroke-dasharray="6,5" marker-end="url(#triHollow)"/>
    <text x="352" y="1182">realization (implements)</text>

    <path d="M612,1178 L560,1178" stroke="#4B5850" stroke-width="1.6" fill="none" marker-end="url(#diamondFilled)"/>
    <text x="622" y="1182">composition (declares)</text>

    <path d="M862,1178 L810,1178" stroke="#4B5850" stroke-width="1.6" fill="none" marker-end="url(#diamondHollow)"/>
    <text x="872" y="1182">aggregation (registers)</text>

    <path d="M1040,1178 L1080,1178" stroke="#4B5850" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <text x="1090" y="1182" font-size="11">dependency / uses</text>
  </g>
</svg>
